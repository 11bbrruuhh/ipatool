name: Download App IPA

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Apple ID email"
        required: true
        type: string
      password:
        description: "Apple ID password"
        required: true
        type: string
      auth_code:
        description: "2FA code (6 digits, leave empty on first run to trigger OTP)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "App bundle ID to download"
        required: true
        type: string

jobs:
  download:
    name: Login + Download IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Build
        run: go build -o ipatool .

      - name: Login (with 2FA code)
        if: ${{ inputs.auth_code != '' }}
        run: |
          ./ipatool auth login \
            --email "${{ inputs.email }}" \
            --password "${{ inputs.password }}" \
            --auth-code "${{ inputs.auth_code }}"

      - name: Login (trigger OTP)
        if: ${{ inputs.auth_code == '' }}
        run: |
          ./ipatool auth login \
            --email "${{ inputs.email }}" \
            --password "${{ inputs.password }}" || true

      - name: Search app
        run: |
          ./ipatool search "${{ inputs.bundle_id }}"

      - name: Download IPA
        run: |
          ./ipatool download \
            --bundle-id "${{ inputs.bundle_id }}" \
            --email "${{ inputs.email }}" \
            --password "${{ inputs.password }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: "*.ipa"
          if-no-files-found: error