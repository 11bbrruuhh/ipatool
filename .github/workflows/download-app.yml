name: Download App IPA

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "2FA code (6 digits; leave empty on first run to trigger OTP)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "App bundle ID to download"
        required: true
        type: string
      version:
        description: "Optional specific version (empty = latest available for account)"
        required: false
        type: string
        default: ""

jobs:
  download:
    name: Login + Download IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Build
        run: go build -o ipatool .

      - name: Login with 2FA
        if: ${{ inputs.auth_code != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
        run: |
          ./ipatool auth login \
            --email "$APPLE_ID" \
            --password "$APPLE_PASS" \
            --auth-code "${{ inputs.auth_code }}" \
            --verbose || true

      - name: Trigger OTP (first pass)
        if: ${{ inputs.auth_code == '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
        run: |
          ./ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASS" || true

      - name: Download IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
        run: |
          ARGS=(download --bundle-id "${{ inputs.bundle_id }}" --email "$APPLE_ID" --password "$APPLE_PASS")
          if [ -n "${{ inputs.version }}" ]; then ARGS+=(--version "${{ inputs.version }}"); fi
          ./ipatool "${ARGS[@]}"

      - name: List output
        run: ls -la *.ipa || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-${{ github.run_number }}
          path: "*.ipa"
          if-no-files-found: warn