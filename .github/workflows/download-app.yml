name: Download App IPA

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "2FA code (6 digits; leave empty on first run to trigger OTP)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "App bundle identifier"
        required: true
        type: string
      app_id:
        description: "Numeric app ID (used if bundle_id empty)"
        required: false
        type: string
        default: ""

jobs:
  download:
    name: Login + Download IPA
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Build
        run: go build -o ipatool .

      - name: Login + Purchase license + Download
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_ID: ${{ inputs.app_id }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          LOGIN_ARGS=(--email "$APPLE_ID" --password "$APPLE_PASS")
          if [ -n "$AUTH_CODE" ]; then LOGIN_ARGS+=(--auth-code "$AUTH_CODE"); fi
          ./ipatool auth login "${LOGIN_ARGS[@]}"

          set -m
        watchdog() { for i in $(seq 1 300); do sleep 10; done; kill %1 2>/dev/null; }
        DL() {
          watchdog & WD=$!
          "$@" > dl.log 2>&1 &
          PID=$!
          wait $PID; RC=$?
          kill $WD 2>/dev/null
          echo "dl rc=$RC"
          tail -c 2000 dl.log | tr "\r" "\n" | tail -20
          return $RC
        }
        if [ -n "$BUNDLE_ID" ]; then
          DL ./ipatool download -b "$BUNDLE_ID" -o app.ipa --purchase --verbose || \
          DL ./ipatool download -b "$BUNDLE_ID" -o app.ipa --verbose || echo "both attempts failed"
        elif [ -n "$APP_ID" ]; then
          DL ./ipatool download -i "$APP_ID" -o app.ipa --purchase --verbose || \
          DL ./ipatool download -i "$APP_ID" -o app.ipa --verbose || echo "both attempts failed"
        fi
        ls -la *.ipa 2>/dev/null || true

      - name: List output
        run: ls -la *.ipa || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-${{ github.run_number }}
          path: "*.ipa"
          if-no-files-found: warn
