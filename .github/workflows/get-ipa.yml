name: Download App IPA

"on":
  workflow_dispatch:
    inputs:
      auth_code:
        description: "2FA code (6 digits; leave empty on first run to trigger OTP)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "App bundle identifier"
        required: true
        type: string
      app_id:
        description: "Numeric app ID (used if bundle_id empty)"
        required: false
        type: string
        default: ""

jobs:
  download:
    name: Login + Download IPA
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Build
        run: go build -o ipatool .

      - name: Probe endpoints
        run: |
          echo "--- bag.itunes.apple.com ---"
          curl -4 -sS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 15 https://bag.itunes.apple.com/bag.xml || echo "v4 bag FAIL"
          echo "--- p25-buy iTunes ---"
          curl -4 -sS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 15 "https://p25-buy.itunes.apple.com/WebObjects/MZFinance.woa/wa/volumeStoreDownloadProduct" || echo "v4 p25 FAIL"
          echo "--- v6 bag ---"
          curl -6 -sS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 15 https://bag.itunes.apple.com/bag.xml || echo "v6 bag FAIL"

      - name: Login + Purchase license + Download
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_ID: ${{ inputs.app_id }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          LOGIN_ARGS=(--email "$APPLE_ID" --password "$APPLE_PASS")
          if [ -n "$AUTH_CODE" ]; then LOGIN_ARGS+=(--auth-code "$AUTH_CODE"); fi
          ./ipatool auth login "${LOGIN_ARGS[@]}"
          
          set -m
          watchdog() { for i in $(seq 1 300); do sleep 10; done; kill %1 2>/dev/null; }
          DL() {
          watchdog & WD=$!
          "$@" 2>&1 | tr "\r" "\n"
          return $RC
          }
          if [ -n "$BUNDLE_ID" ]; then
          DL ./ipatool download -b "$BUNDLE_ID" -o app.ipa --purchase --verbose || \
          DL ./ipatool download -b "$BUNDLE_ID" -o app.ipa --verbose || echo "both attempts failed"
          elif [ -n "$APP_ID" ]; then
          DL ./ipatool download -i "$APP_ID" -o app.ipa --purchase --verbose || \
          DL ./ipatool download -i "$APP_ID" -o app.ipa --verbose || echo "both attempts failed"
          fi
          ls -la *.ipa 2>/dev/null || true
          
      - name: List output
        run: ls -la *.ipa || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-${{ github.run_number }}
          path: "*.ipa"
          if-no-files-found: warn
# trigger re-registration

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_number }}
          path: |
            dl.log
            purchase.log
          if-no-files-found: ignore