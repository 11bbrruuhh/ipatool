name: Build SAP-fix binaries

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build macOS binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Run tests
        run: go test ./pkg/http/... ./pkg/appstore/...

      - name: Build macOS arm64 (SAP signing enabled)
        run: go build -o ipatool-sapfix-macos-arm64 .
        env:
          CGO_ENABLED: "1"

      - name: Build macOS amd64 (SAP signing enabled)
        run: go build -o ipatool-sapfix-macos-amd64 .
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-sapfix-macos-arm64
          path: ipatool-sapfix-macos-arm64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-sapfix-macos-amd64
          path: ipatool-sapfix-macos-amd64
          if-no-files-found: error