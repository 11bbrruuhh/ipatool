name: Download App IPA

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "2FA code (6 digits; leave empty on first run to trigger OTP)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "App bundle identifier"
        required: true
        type: string
      app_id:
        description: "Numeric app ID (used if bundle_id empty)"
        required: false
        type: string
        default: ""

jobs:
  download:
    name: Login + Download IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Build
        run: go build -o ipatool .

      - name: Login with 2FA + Purchase license + Download
        if: ${{ inputs.auth_code != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          ./ipatool auth login \
            --email "$APPLE_ID" \
            --password "$APPLE_PASS" \
            --auth-code "${{ inputs.auth_code }}"

          if [ -n "$BUNDLE_ID" ]; then
            ./ipatool download -b "$BUNDLE_ID" -o app.ipa --purchase || \
            ./ipatool download -b "$BUNDLE_ID" -o app.ipa
          elif [ -n "$APP_ID" ]; then
            ./ipatool download -i "$APP_ID" -o app.ipa --purchase || \
            ./ipatool download -i "$APP_ID" -o app.ipa
          else
            echo "need bundle_id or app_id"; exit 1
          fi

      - name: Trigger OTP (first pass)
        if: ${{ inputs.auth_code == '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
        run: |
          ./ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASS" || true

      - name: List output
        run: ls -la *.ipa || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-${{ github.run_number }}
          path: "*.ipa"
          if-no-files-found: warn