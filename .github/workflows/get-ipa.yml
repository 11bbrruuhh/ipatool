name: Download App IPA

"on":
  workflow_dispatch:
    inputs:
      auth_code:
        description: "2FA code (6 digits; leave empty on first run to trigger OTP)"
        required: false
        type: string
        default: ""
      bundle_id:
        description: "App bundle identifier"
        required: true
        type: string
      app_id:
        description: "Numeric app ID (used if bundle_id empty)"
        required: false
        type: string
        default: ""

jobs:
  download:
    name: Login + Download IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate mocks
        run: go generate ./...

      - name: Build
        run: go build -o ipatool .

      - name: Login + Download (captured)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_ID: ${{ inputs.app_id }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          LOGIN_ARGS=(--email "$APPLE_ID" --password "$APPLE_PASS")
          if [ -n "$AUTH_CODE" ]; then LOGIN_ARGS+=(--auth-code "$AUTH_CODE"); fi
          ./ipatool auth login "${LOGIN_ARGS[@]}"
          set -m
          run_bg_capture() {
            "$@" > step.log 2>&1 &
            PID=$!
            for i in $(seq 1 45); do
              sleep 10
              kill -0 $PID 2>/dev/null || break
            done
            if kill -0 $PID 2>/dev/null; then
              echo "--- still running after 450s; killing ---"
              kill $PID 2>/dev/null; sleep 2
            fi
            echo "--- step.log tail ---"
            tr "\r" "\n" < step.log | tail -40
            [ -f app.ipa ] && return 0 || return 1
          }
          OK=1
          if [ -n "$BUNDLE_ID" ]; then
            run_bg_capture ./ipatool download -b "$BUNDLE_ID" -o app.ipa --purchase --verbose || \
            run_bg_capture ./ipatool download -b "$BUNDLE_ID" -o app.ipa --verbose || OK=0
          elif [ -n "$APP_ID" ]; then
            run_bg_capture ./ipatool download -i "$APP_ID" -o app.ipa --purchase --verbose || \
            run_bg_capture ./ipatool download -i "$APP_ID" -o app.ipa --verbose || OK=0
          else
            echo "need bundle_id or app_id"; exit 1
          fi
          ls -la *.ipa 2>/dev/null || true
          [ "$OK" = "1" ] || { echo "download did not produce ipa"; }

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_number }}
          path: |
            step.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa-${{ github.run_number }}
          path: "*.ipa"
          if-no-files-found: ignore